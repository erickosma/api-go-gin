<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">


    <form hx-post="/submit" hx-trigger="submit" hx-swap="outerHTML" class="space-y-4" method="post" >
        <h1 class="text-2xl font-bold mb-6 text-center">Formulário de Contato</h1>
<!--    <form action="/submit" method="post"  class="space-y-4">-->

        <div>
            <label for="name" class="block text-sm font-medium text-gray-700">Nome</label>
            <input type="text"
                   id="name"
                   name="name"
                   required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
        </div>

        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email"
                   id="email"
                   name="email"
                   required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
        </div>

        <div>
            <label for="whatsapp" class="block text-sm font-medium text-gray-700">WhatsApp</label>
            <input type="tel"
                   id="whatsapp"
                   name="whatsapp"
                   required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
        </div>

        <button type="submit"
                id="submit-btn"
                class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            Enviar
        </button>
    </form>

    <div id="message" class="mt-4 text-center hidden">
        teste
    </div>
</div>
</body>
</html>
